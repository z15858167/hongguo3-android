name: build-android

# 分支策略：
#   dev  —— 日常开发分支，推上来就构建，产物发成「预发布」，每次一个新 tag，互不覆盖
#   main —— 只接受从 dev 来的 PR 合并；合并后发正式版本（tag vX.Y.Z），历史全部保留
#   PR   —— 只构建校验，不发版
on:
  push:
    branches: [ main, dev ]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'keystore/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'keystore/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK（platform / build-tools / NDK / CMake）
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          echo "sdkmanager = $SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" \
                          "ndk;26.1.10909125" "cmake;3.22.1"
          ls "$SDK/ndk" || true

      # 静态体检：phdr 表必须在 LOAD 段内（bionic 硬性要求，v0.1.1 踩过坑）、
      # 每个 LOAD 的 p_offset ≡ p_vaddr (mod 各自 p_align)、打包后 APK 里的 so 也复查。
      # 4 KB 对齐的原始 so 和 16 KB 重排后的 so 都能过（按各自 p_align 查）。
      - name: 静态体检（preflight）
        run: python3 tools/preflight.py

      - name: 读取版本号
        id: ver
        run: |
          NAME=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          CODE=$(sed -n 's/.*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)
          test -n "$NAME" || { echo "读不到 versionName"; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "版本：$NAME (versionCode $CODE)"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 编译 APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: 校验产物
        run: |
          ls -lh app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          unzip -l "$APK" | grep -E "lib/arm64-v8a|classes.dex|AndroidManifest" | head -10
          echo "--- 大小 ---"
          du -h "$APK"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-${{ steps.ver.outputs.name }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      # ---------- dev：每次推送留一个预发布，tag 带 build 号，永不覆盖 ----------
      - name: 发布开发版（dev）
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-dev.${{ github.run_number }}
          name: v${{ steps.ver.outputs.name }} 开发版 #${{ github.run_number }}
          prerelease: true
          body: |
            dev 分支自动构建，用于真机验证。

            分支：dev
            提交：${{ github.sha }}
            versionCode：${{ steps.ver.outputs.code }}

            · 只支持 arm64-v8a（64 位安卓）
            · 装不上先看 README 的「常见问题」
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------- main：一个版本一个 release，历史全部保留 ----------
      - name: 发布正式版（main）
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          V="${{ steps.ver.outputs.name }}"
          TAG="v$V"
          # 同名版本已存在（改了代码却没升 versionName）时追加 build 号，绝不覆盖旧版本
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TAG="v$V-b${{ github.run_number }}"
          fi
          echo "发布 tag = $TAG"

          cat > /tmp/notes.md <<EOF
          main 分支正式版。

          - versionCode：${{ steps.ver.outputs.code }}
          - 提交：${{ github.sha }}
          - 构建：#${{ github.run_number }}

          只支持 arm64-v8a（64 位安卓）。装不上先看 README 的「常见问题」。
          EOF

          gh release create "$TAG" app/build/outputs/apk/release/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$V (versionCode ${{ steps.ver.outputs.code }})" \
            --notes-file /tmp/notes.md

      # latest 只是一个「指向最新」的滚动指针，方便手机用固定链接下载；
      # 真正的历史版本在版本化 tag 里，不受影响。
      - name: 更新 latest 指针
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新版 v${{ steps.ver.outputs.name }}
          prerelease: true
          body: |
            滚动指针，始终指向 main 最新一次构建（v${{ steps.ver.outputs.name }} / build ${{ github.run_number }}）。
            需要固定某个版本，请到 Releases 列表里找对应的 vX.Y.Z。
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

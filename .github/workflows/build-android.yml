name: build-android

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK（platform / build-tools / NDK / CMake）
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          echo "sdkmanager = $SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" \
                          "ndk;26.1.10909125" "cmake;3.22.1"
          ls "$SDK/ndk" || true

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 编译 APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: 校验产物
        run: |
          ls -lh app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          unzip -l "$APK" | grep -E "lib/arm64-v8a|classes.dex|AndroidManifest" | head -10
          echo "--- 大小 ---"
          du -h "$APK"

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-android
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

name: build-android

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK（platform / build-tools / NDK / CMake）
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          echo "sdkmanager = $SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" \
                          "ndk;26.1.10909125" "cmake;3.22.1"
          ls "$SDK/ndk" || true

      # 上游这份 so 是 4 KB 页对齐（align 2**12），Android 15 的 16 KB 页机型会拒绝加载。
      # patchelf 能不动 vaddr 地把 p_align 抬到 16 KB：vaddr 不变 => 运行时的符号偏移也不变。
      # 只在 CI 里改，仓库里的原始文件保持原样。
      - name: 让 so 兼容 16KB 页（Android 15+）
        run: |
          SO=app/src/main/jniLibs/arm64-v8a/libmetasec_ml.so
          cp "$SO" /tmp/metasec.orig.so
          P=""
          command -v patchelf >/dev/null 2>&1 && P=patchelf
          # 系统自带的 patchelf 往往太旧（没有 --page-size），优先用 PyPI 的新版
          if [ -z "$P" ]; then
            python3 -m pip install --quiet --user patchelf >/dev/null 2>&1 || true
            [ -x "$HOME/.local/bin/patchelf" ] && P="$HOME/.local/bin/patchelf"
          fi
          if [ -z "$P" ]; then
            sudo apt-get update -qq >/dev/null 2>&1 && \
              sudo apt-get install -y -qq patchelf >/dev/null 2>&1 || true
            command -v patchelf >/dev/null 2>&1 && P=patchelf
          fi
          if [ -z "$P" ]; then
            echo "没有 patchelf，跳过（4 KB 页机型不受影响）"
          else
            echo "patchelf: $("$P" --version 2>&1 | head -1)"
            "$P" --page-size 16384 "$SO" || echo "patchelf 出错"
            python3 check_align.py "$SO" || cp /tmp/metasec.orig.so "$SO"
          fi

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 编译 APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: 校验产物
        run: |
          ls -lh app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          unzip -l "$APK" | grep -E "lib/arm64-v8a|classes.dex|AndroidManifest" | head -10
          echo "--- 大小 ---"
          du -h "$APK"

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-android
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # 滚动发布到同一个 tag：main 上每次有改动都更新这里，手机直接下这个链接就行
      - name: 发布到 latest 预发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建（自动）
          body: |
            每次 main 有新提交都会更新这里。

            · 只支持 arm64-v8a（64 位安卓）
            · 首次打开需要联网，签名在本地完成，不连任何第三方服务器
            · 装不上先看 README 的「常见问题」
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

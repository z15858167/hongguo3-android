name: build-android

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK（platform / build-tools / NDK / CMake）
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          echo "sdkmanager = $SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" \
                          "ndk;26.1.10909125" "cmake;3.22.1"
          ls "$SDK/ndk" || true

      # so 已经在仓库里重排成 16 KB 页对齐（tools/align16k.py），这里只是复查一遍，
      # 免得有人不小心把 4 KB 版的原文件覆盖回来（Android 15 的 16 KB 页机型会加载失败）。
      - name: 校验 so 的 16KB 页对齐
        run: python3 tools/check_align.py app/src/main/jniLibs/arm64-v8a/libmetasec_ml.so

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 编译 APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: 校验产物
        run: |
          ls -lh app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          unzip -l "$APK" | grep -E "lib/arm64-v8a|classes.dex|AndroidManifest" | head -10
          echo "--- 大小 ---"
          du -h "$APK"

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-android
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # 滚动发布到同一个 tag：main 上每次有改动都更新这里，手机直接下这个链接就行
      - name: 发布到 latest 预发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建（自动）
          body: |
            每次 main 有新提交都会更新这里。

            · 只支持 arm64-v8a（64 位安卓）
            · 首次打开需要联网，签名在本地完成，不连任何第三方服务器
            · 装不上先看 README 的「常见问题」
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

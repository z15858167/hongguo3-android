plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hongguo.client'
    compileSdk 34
    ndkVersion "26.1.10909125"

    // 与 Manifest 的 extractNativeLibs="true" 配套：so 在 APK 里压缩存储、
    // 安装时解压到 /data/.../lib/arm64/（linker 的 maps 里能看到真实文件名）
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    defaultConfig {
        applicationId "com.hongguo.client"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "0.3.1"
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=none"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            // 千万别开 minify：ms.bd.c.m / ms.bd.c.a4$a / ...metasec.ml.MS 这三个类
            // 没有任何 Java 代码引用它们（只有 so 通过 FindClass / RegisterNatives 找），
            // 一旦被 R8 移除或改名，加载 so 就会崩。
            minifyEnabled false
            shrinkResources false
            // CI 上没有自定义 keystore，用 AGP 自带的 debug 签名（可直接安装）
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}

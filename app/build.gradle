plugins {
    id 'com.android.application'
}

// 固定签名：keystore/keystore.properties 指向仓库里的 hongguo.jks。
// 没有它就只能回落到 AGP 的 debug 签名（每台机器/每次 CI 都不一样 → 覆盖安装报签名不同）。
def keystorePropsFile = rootProject.file('keystore/keystore.properties')
def hasFixedKey = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasFixedKey) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.hongguo.client'
    compileSdk 34
    ndkVersion "26.1.10909125"

    // 与 Manifest 的 extractNativeLibs="true" 配套：so 在 APK 里压缩存储、
    // 安装时解压到 /data/.../lib/arm64/（linker 的 maps 里能看到真实文件名）
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    defaultConfig {
        applicationId "com.hongguo.client"
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName "0.9.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=none"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version "3.22.1"
        }
    }

    signingConfigs {
        fixed {
            if (hasFixedKey) {
                storeFile rootProject.file("keystore/${keystoreProps['storeFile']}")
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // 本机调试包也用同一把 key：这样 Debug 包和 CI 的 Release 包可以互相覆盖安装，
            // 不会出现"装过 Debug 版就再也装不上 Release"的签名冲突。
            signingConfig hasFixedKey ? signingConfigs.fixed : signingConfigs.debug
        }
        release {
            // 千万别开 minify：ms.bd.c.m / ms.bd.c.a4$a / ...metasec.ml.MS 这三个类
            // 没有任何 Java 代码引用它们（只有 so 通过 FindClass / RegisterNatives 找），
            // 一旦被 R8 移除或改名，加载 so 就会崩。
            minifyEnabled false
            shrinkResources false
            // 固定 key 签名，本机与 CI 一致，可直接覆盖安装；没有 keystore 时退回 debug 签名
            signingConfig hasFixedKey ? signingConfigs.fixed : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}

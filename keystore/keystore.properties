# 固定签名（自用 App，不发布应用商店）。
#
# 为什么必须有这个文件：以前 release 用的是 AGP 自动生成的 debug 签名，
#   - 本机第一次构建时生成一份 ~/.android/debug.keystore；
#   - GitHub Actions 每次都是干净容器，会**重新随机生成**一份。
# 于是每次 CI 出的 APK 签名都不一样，覆盖安装必然报
#   INSTALL_FAILED_UPDATE_INCOMPATIBLE（与已安装的应用签名不同）。
# 换成仓库里这把固定 key 之后，本机 / CI 出的包签名一致，可以直接覆盖升级。
storeFile=hongguo.jks
